[package]
name = "litastum"
version = "0.1.0"
edition = "2021"
description = "A cross-platform, keyboard-driven dual-pane file manager (Far Manager-inspired), written in Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/YOUR_USERNAME/litastum"

[dependencies]
crossterm = "0.28"
ratatui = "0.29"
directories = "6.0"
color-eyre = "0.6"
tui-textarea = "0.7"
arboard = { version = "3.6", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
