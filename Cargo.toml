[package]
name = "litastum"
version = "0.1.0"
edition = "2021"
description = "A cross-platform, keyboard-driven dual-pane file manager (Far Manager-inspired), written in Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/YOUR_USERNAME/litastum"

# `gui/`: the windowed host; `xtask/`: `cargo xtask dist`
# (docs/history/launching.md).
[workspace]
members = ["gui", "xtask"]

[dependencies]
crossterm = "0.29"
ratatui = "0.30"
directories = "6.0"
color-eyre = "0.6"
edtui = { version = "0.11", default-features = false, features = ["mouse-support", "syntax-highlighting"] }
arboard = { version = "3.6", default-features = false }
unicode-width = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "bmp"] }
ratatui-image = { version = "11.0.8", default-features = false, features = ["crossterm"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
ignore = "0.4"
similar = "2"
ctrlc = "3"
# Commands run in a pseudoconsole and their output is kept as a grid
# (user_screen); the same engine as the window's (gui/).
alacritty_terminal = "0.26.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Storage_FileSystem",
    "Win32_System_WindowsProgramming",
    "Win32_System_Console",
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.52"

# The window (gui/) draws every cell of the screen when the editor
# scrolls; unoptimized, that took ~100 ms a frame, so held arrow keys
# piled up and the text jumped. Optimized even in debug builds, with the
# crates it spends its time in; the console app's build is unchanged.
[profile.dev.package.litastum-gui]
opt-level = 3

[profile.dev.package.cosmic-text]
opt-level = 3

[profile.dev.package.swash]
opt-level = 3

[profile.dev.package.alacritty_terminal]
opt-level = 3

[profile.dev.package.vte]
opt-level = 3

[profile.dev.package.softbuffer]
opt-level = 3

# The same for the console app's editor: on a 300k-line file a frame
# took ~40 ms in a debug build, nearly all of it in these crates (edtui's
# rendering, syntect, the diff for Compare). litastum's own code stays
# unoptimized, so stepping through it in a debugger is unchanged.
[profile.dev.package.edtui]
opt-level = 3

[profile.dev.package."edtui-jagged"]
opt-level = 3

[profile.dev.package."ratatui-core"]
opt-level = 3

[profile.dev.package."ratatui-widgets"]
opt-level = 3

[profile.dev.package.syntect]
opt-level = 3

[profile.dev.package.onig]
opt-level = 3

[profile.dev.package."onig_sys"]
opt-level = 3

[profile.dev.package."fancy-regex"]
opt-level = 3

[profile.dev.package."regex-automata"]
opt-level = 3

[profile.dev.package.similar]
opt-level = 3

[profile.dev.package."unicode-width"]
opt-level = 3
