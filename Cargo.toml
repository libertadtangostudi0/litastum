[package]
name = "litastum"
version = "0.1.0"
edition = "2021"
description = "A cross-platform, keyboard-driven dual-pane file manager (Far Manager-inspired), written in Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/YOUR_USERNAME/litastum"

[dependencies]
crossterm = "0.29"
ratatui = "0.30"
directories = "6.0"
color-eyre = "0.6"
edtui = { version = "0.11", default-features = false, features = ["mouse-support", "syntax-highlighting"] }
arboard = { version = "3.6", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "bmp"] }
ratatui-image = { version = "11.0.8", default-features = false, features = ["crossterm"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Storage_FileSystem",
    "Win32_System_WindowsProgramming",
] }
